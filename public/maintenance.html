<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Site en maintenance</title>
  <style>
    body{
      margin:0;
      height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#F5FCF8;
      font-family: Inter, Arial, sans-serif;
      color:#1f2937;
      padding:20px;
      text-align:center;
    }
    .box{
      background:#ffffff;
      padding:40px 30px;
      border-radius:14px;
      box-shadow:0 10px 30px rgba(0,0,0,0.08);
      max-width:420px;
      width:100%;
    }
    h1{
      font-size:22px;
      margin-bottom:12px;
      font-weight:600;
      color:#D59B49;
    }
    p{
      font-size:16px;
      color:#6b7280;
      line-height:1.6;
      margin:0;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>🔧 Site en maintenance</h1>
    <p>Nous procédons actuellement à des mises à jour afin d'améliorer votre expérience. Merci pour votre patience.</p>
  </div>
</body>
</html>
